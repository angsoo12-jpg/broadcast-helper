<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>참예수교회 M32/X32 방송 매뉴얼 & 챗봇</title>
<style>
  /* ── 오프라인 완결형: 외부 CDN/폰트 의존 없음 ── */
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel-2:#273549; --line:#334155;
    --text:#e2e8f0; --muted:#94a3b8; --blue:#2563eb; --blue-l:#60a5fa;
    --amber:#fbbf24; --warn:#fca5a5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column;
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; line-height:1.55;}
  .wrap{max-width:960px; width:100%; margin:0 auto; padding:0 16px;}

  header{background:var(--panel); border-bottom:1px solid var(--line); padding:12px 0;}
  .head-row{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:12px;}
  .logo{background:var(--blue); width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:19px;}
  h1{font-size:18px; margin:0; color:#fff;}
  .sub{font-size:12px; color:var(--muted); margin:2px 0 0;}
  .tag{background:rgba(37,99,235,.18); color:var(--blue-l); border:1px solid rgba(37,99,235,.4); font-size:12px; padding:5px 12px; border-radius:999px; white-space:nowrap;}

  /* 탭 */
  .tabs{display:flex; gap:8px; margin:14px 0 4px;}
  .tab{flex:0 0 auto; background:var(--panel); border:1px solid var(--line); color:var(--muted);
    padding:9px 16px; border-radius:10px; cursor:pointer; font-size:14px; font-weight:600;}
  .tab.active{background:var(--blue); color:#fff; border-color:var(--blue);}
  .tab:focus-visible{outline:2px solid var(--blue-l); outline-offset:2px;}

  main{flex:1; display:flex; flex-direction:column; gap:14px; padding:8px 0 10px;}
  .view{display:none; flex-direction:column; gap:14px;}
  .view.active{display:flex;}

  /* 골든룰 미니 스트립 */
  .golden{display:flex; gap:9px; align-items:center; padding:8px 4px;}
  .golden .dot{color:var(--amber); flex-shrink:0; font-size:16px; line-height:1;}
  .golden p{margin:0; font-size:12.5px; line-height:1.5; color:var(--muted);}
  .golden .key{color:var(--text); font-weight:600;}

  .faq{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:14px;}
  .faq .label{color:var(--muted); font-weight:600; margin-right:4px;}
  .chip{background:var(--panel); border:1px solid var(--line); color:var(--text); padding:7px 11px; border-radius:10px; cursor:pointer; font-size:13px;}
  .chip:hover,.chip:focus-visible{background:var(--panel-2); outline:2px solid var(--blue-l); outline-offset:1px;}

  #chatBox{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; overflow-y:auto; min-height:400px; max-height:600px; display:flex; flex-direction:column; gap:12px;}
  .row{display:flex; gap:10px; align-items:flex-start;}
  .row.user{justify-content:flex-end;}
  .avatar{background:var(--blue); width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; margin-top:2px;}
  .bubble{background:var(--panel-2); border:1px solid var(--line); padding:13px 15px; border-radius:16px; border-top-left-radius:4px; max-width:86%; font-size:14px;}
  .bubble .t{font-weight:700; color:var(--amber); margin:0 0 7px;}
  .bubble .intro-t{color:var(--blue-l);}
  .bubble.user-b{background:var(--blue); color:#fff; border:none; border-top-left-radius:16px; border-top-right-radius:4px; max-width:80%;}
  .bubble strong{color:#fff;} .bubble ol,.bubble ul{margin:4px 0 0; padding-left:18px;} .bubble li{margin-bottom:3px;}
  .hl{color:var(--amber); font-weight:600;} .warnnote{color:var(--warn);}

  .input-wrap{position:relative;}
  #userInput{width:100%; background:var(--panel); border:1px solid var(--line); color:#fff; border-radius:12px; padding:14px 58px 14px 16px; font-size:15px;}
  #userInput:focus{outline:none; border-color:var(--blue-l);}
  #sendBtn{position:absolute; right:8px; top:8px; bottom:8px; background:var(--blue); color:#fff; border:none; padding:0 16px; border-radius:9px; cursor:pointer; font-size:15px;}
  #sendBtn:hover{background:#1d4ed8;}

  /* ── 매뉴얼 뷰 ── */
  .m-note{font-size:12.5px; color:var(--muted); margin:0 2px 4px;}
  .m-note b{color:var(--amber);}
  .sec{font-size:15px; font-weight:700; color:#fff; border-left:3px solid var(--blue-l); padding-left:9px; margin:8px 0 2px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 15px;}
  .card h4{margin:0 0 6px; font-size:13.5px; color:var(--blue-l);}
  .card ol,.card ul{margin:0; padding-left:18px;} .card li{margin-bottom:4px; font-size:13px; color:var(--text);}
  .card p{margin:0 0 4px; font-size:13px;}
  .kbd{background:var(--panel-2); border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-size:12px; color:#e2e8f0;}
  table.mt{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:2px;}
  table.mt th{background:#0f172a; color:#fff; text-align:left; padding:6px 8px; border:1px solid var(--line);}
  table.mt td{padding:6px 8px; border:1px solid var(--line); color:var(--text); vertical-align:top;}
  .m-warn{color:var(--warn); font-weight:600;}

  footer{text-align:center; padding:14px 0; color:#64748b; font-size:12px; border-top:1px solid var(--panel);}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
  @media (max-width:520px){ h1{font-size:16px;} .bubble{max-width:93%;} }
</style>
</head>
<body>

<header>
  <div class="wrap head-row">
    <div class="brand">
      <div class="logo">🎚️</div>
      <div>
        <h1>참예수교회 M32/X32 방송 매뉴얼 & 챗봇</h1>
        <p class="sub">전체 매뉴얼 열람 + 대화형 트러블슈팅 도우미</p>
      </div>
    </div>
    <span class="tag">M32 / X32 전용</span>
  </div>
</header>

<main class="wrap">
  <div class="tabs">
    <button class="tab active" id="tabChat" onclick="switchView('chat')">💬 챗봇 도우미</button>
    <button class="tab" id="tabManual" onclick="switchView('manual')">📖 전체 매뉴얼</button>
  </div>

  <!-- ================= 챗봇 뷰 ================= -->
  <div class="view active" id="view-chat">
    <div class="golden">
      <span class="dot" aria-hidden="true">&#9888;</span>
      <p><span class="key">조작 전 채널 SELECT 먼저</span> · 화면 상단에 채널 이름이 맞게 떴는지 확인. 다른 채널에 눌려 있으면 방송 사고가 납니다.</p>
    </div>

    <div class="faq">
      <span class="label">⚡ 자주 묻는 질문:</span>
      <button class="chip" onclick="askQuestion('소리가 안 나와요')">🚨 소리 안 남</button>
      <button class="chip" onclick="askQuestion('OBS 방송 소리 조절')">📺 OBS/방송</button>
      <button class="chip" onclick="askQuestion('에코 넣기')">✨ 에코/리버브</button>
      <button class="chip" onclick="askQuestion('피드백 삐 소리')">🎤 피드백</button>
      <button
